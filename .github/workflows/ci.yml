name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  clippy:
    name: clippy
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  npm-check:
    name: svelte-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Type-check every npm workspace
        run: npm run check

  parser-generation:
    name: parser generation
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: bootstrap twice (verify stable)
        run: |
          cargo xtask bootstrap
          cargo xtask bootstrap
          if ! git diff --quiet; then
            echo "::error::cargo xtask bootstrap produced changes:"
            git diff --stat
            git diff
            exit 1
          fi

      - name: iguana & iguana-runtime tests
        run: |
          cargo test -p iguana
          cargo test -p iguana-runtime

      - name: regenerate all test parsers (verify stable)
        run: |
          cargo xtask test-gen-all
          if ! git diff --quiet; then
            echo "::error::cargo xtask test-gen-all produced changes:"
            git diff --stat
            git diff
            exit 1
          fi

  workspace-test:
    name: workspace tests
    needs: parser-generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  terrarium:
    name: terrarium build & smoke test
    needs: parser-generation
    runs-on: ubuntu-latest
    # A green run takes ~8 minutes; without a limit a hung smoke test runs to
    # GitHub's 6-hour kill and burns the private-repo minute budget.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: terrarium/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        working-directory: terrarium
        run: npm run tauri build -- --no-bundle

      - name: Smoke test (launch headless, wait for ready marker)
        timeout-minutes: 5
        run: |
          TERRARIUM_SMOKE_TEST=1 xvfb-run -a ./terrarium/src-tauri/target/release/terrarium > smoke.log 2>&1
          EXIT=$?
          if [ $EXIT -eq 0 ] && grep -q "TERRARIUM_READY" smoke.log; then
            echo "Smoke test passed"
          else
            echo "::error::Smoke test failed (exit=$EXIT)"
            cat smoke.log
            exit 1
          fi
