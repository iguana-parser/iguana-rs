name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        description: Exact candidate commit to validate
        required: true
        type: string
      rust_toolchain:
        description: Rust toolchain to validate (releases pass their pinned version)
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  configure:
    name: Select CI toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust_toolchain: ${{ steps.toolchain.outputs.rust_toolchain }}
    steps:
      - id: toolchain
        env:
          CI_INPUTS: ${{ toJSON(inputs) }}
        run: |
          # workflow_call requires this key; ordinary CI may have unrelated inputs.
          # An explicitly empty toolchain must fail instead of falling back to stable.
          if jq -e 'type == "object" and has("rust_toolchain")' <<< "$CI_INPUTS" > /dev/null; then
            TOOLCHAIN=$(jq -r '.rust_toolchain // ""' <<< "$CI_INPUTS")
          else
            TOOLCHAIN=stable
          fi
          if [[ -z "$TOOLCHAIN" || "$TOOLCHAIN" == *[[:space:]]* ]]; then
            echo '::error::Reusable CI requires a nonempty rust_toolchain input with no whitespace.'
            exit 1
          fi
          echo "rust_toolchain=$TOOLCHAIN" >> "$GITHUB_OUTPUT"

  fmt:
    name: rustfmt
    needs: configure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.configure.outputs.rust_toolchain }}
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path tests/Cargo.toml --all --check
      - run: cargo fmt --manifest-path terrarium/src-tauri/Cargo.toml --all --check
      - run: cargo fmt --manifest-path iguana-lsp/wasm/Cargo.toml --all --check

  check:
    name: cargo check
    needs: configure
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.configure.outputs.rust_toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tests
      - run: cargo check --workspace --all-targets
      - run: cargo check --manifest-path tests/Cargo.toml --workspace --all-targets

  clippy:
    name: clippy
    needs: [configure, check]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.configure.outputs.rust_toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tests
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy --manifest-path tests/Cargo.toml --workspace --all-targets

  lsp-wasm-clippy:
    name: clippy (iguana-lsp wasm)
    needs: [configure, check]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.configure.outputs.rust_toolchain }}
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: iguana-lsp/wasm
      # The crate builds only for wasm32, through wasm-pack; clippy needs the
      # same target.
      - run: cargo clippy --manifest-path iguana-lsp/wasm/Cargo.toml --target wasm32-unknown-unknown --all-targets

  npm-check:
    name: svelte-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Type-check every npm workspace
        run: npm run check

  parser-generation:
    name: parser generation
    needs: [configure, check]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.configure.outputs.rust_toolchain }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: bootstrap twice (verify stable)
        run: |
          for pass in 1 2; do
            cargo xtask bootstrap
            git add --all
            if [ "$(git write-tree)" != "$(git rev-parse 'HEAD^{tree}')" ]; then
              echo "::error::cargo xtask bootstrap produced changes on pass $pass:"
              git diff --cached --stat
              git diff --cached
              exit 1
            fi
          done

      - name: iguana & iguana-runtime tests
        run: |
          cargo test -p iguana
          cargo test -p iguana-runtime

      - name: regenerate all test parsers (verify stable)
        run: |
          cargo xtask test-gen-all
          git add --all
          if [ "$(git write-tree)" != "$(git rev-parse 'HEAD^{tree}')" ]; then
            echo "::error::cargo xtask test-gen-all produced changes:"
            git diff --cached --stat
            git diff --cached
            exit 1
          fi

  workspace-test:
    name: workspace and grammar tests
    needs: [configure, parser-generation]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.configure.outputs.rust_toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tests
      - name: cargo tests of both workspaces, then the grammar golden files
        run: cargo xtask test

  terrarium:
    name: terrarium build, checks & smoke test
    needs: [configure, parser-generation]
    runs-on: ubuntu-latest
    # Without a limit a hung smoke test runs to GitHub's 6-hour kill and burns
    # the private-repo minute budget.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ needs.configure.outputs.rust_toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: terrarium/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        working-directory: terrarium
        run: npm run tauri build -- --no-bundle

      # Runs after the app build so the frontend bundle the Tauri build script
      # expects exists. The tests use the release profile to reuse the
      # dependency artifacts of that build.
      - name: Clippy and tests for the Tauri backend
        run: |
          cargo clippy --manifest-path terrarium/src-tauri/Cargo.toml --all-targets
          cargo test --manifest-path terrarium/src-tauri/Cargo.toml --release

      - name: Smoke test (launch headless, wait for ready marker)
        timeout-minutes: 5
        run: |
          TERRARIUM_SMOKE_TEST=1 xvfb-run -a ./terrarium/src-tauri/target/release/terrarium > smoke.log 2>&1
          EXIT=$?
          if [ $EXIT -eq 0 ] && grep -q "TERRARIUM_READY" smoke.log; then
            echo "Smoke test passed"
          else
            echo "::error::Smoke test failed (exit=$EXIT)"
            cat smoke.log
            exit 1
          fi
