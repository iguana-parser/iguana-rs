[workspace]  # standalone workspace, excluded from parent to speed up rust-analyzer

# Mirrors the parent workspace lint policy (see the root Cargo.toml).
[workspace.lints.rust]
warnings = "deny"
# No unsafe anywhere in the codebase; `forbid` so it cannot be re-enabled locally.
unsafe_code = "forbid"

[workspace.lints.clippy]
collapsible_if = "allow"
collapsible_match = "allow"

[package]
name = "terrarium"
version = "0.1.0"
description = "Iguana grammar debugger"
authors = ["you"]
edition = "2021"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[lib]
name = "terrarium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tempfile = "3"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
specta-typescript = "0.0.12"
iguana-runtime = { path = "../../iguana-runtime" }
iguana-lsp = { path = "../../iguana-lsp" }
lsp-types = "0.97"
chrono = "0.4"

# Optimize dependencies in dev builds so the parser runs at near-release speed.
# The terrarium crate itself stays at opt-level 0 for fast compiles.
[profile.dev.package."*"]
opt-level = 2

# Redirect git-based iguana-runtime references (used by iggy and the
# generated test parsers) to the local copy. Without this, cargo would
# try to fetch from GitHub and fail on private repos / offline builds.
[patch."https://github.com/iguana-parser/iguana-rs"]
iguana-runtime = { path = "../../iguana-runtime" }
