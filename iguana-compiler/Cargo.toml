[package]
name = "iguana-compiler"
version.workspace = true
edition = "2024"
license-file = "LICENSE-GPL"
description = "The iguana compiler (grammar IR, analysis, transforms, and code generation): translates iggy grammar definitions into Rust code"
repository.workspace = true
readme = "README.md"
keywords = ["parser", "generator", "gll", "grammar", "codegen"]
categories = ["parsing", "development-tools"]

[features]
debug-trace = ["iguana-runtime/debug-trace", "iggy/debug-trace"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
iguana-runtime.workspace = true
iggy.workspace = true
proc-macro2.workspace = true
quote.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
specta.workspace = true
syn = { version = "2.0.108", features = ["full", "parsing"] }
indexmap = "2.12.1"
itertools = "0.14.0"
regex = "1"
