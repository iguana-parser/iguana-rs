<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>iguana parse viewer</title>
    <!--
      The grammar's manifest and wasm parser sit next to this page in a
      generated bundle. App.svelte loads them once the viewer script runs, and
      these hints start the downloads while that script is still loading. The
      wasm-bindgen glue and App.svelte fetch with fetch() defaults, a CORS
      request with same-origin credentials. `crossorigin` gives the preloads
      the same mode, and the browser reuses a preloaded response only when the
      modes match.
    -->
    <link rel="modulepreload" href="./wasm/pkg/parser.js"  />
    <link rel="preload" href="./wasm/pkg/parser_bg.wasm" as="fetch" crossorigin  />
    <link rel="preload" href="./manifest.json" as="fetch" crossorigin  />
    <!-- Host overrides, empty by default; see public/theme.css. -->
    <link rel="stylesheet" href="./theme.css" />
    <script type="module" crossorigin src="./assets/index.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/text-positions.js">
    <link rel="modulepreload" crossorigin href="./assets/theme.js">
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
