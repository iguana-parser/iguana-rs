[package]
name = "iguana"
version.workspace = true
edition = "2024"
license.workspace = true
description = "A high-performance GLL parser generator supporting the full class of context-free grammars, with declarative disambiguation and typed parse trees"
repository.workspace = true
readme = "README.md"
keywords = ["parser", "generator", "gll", "grammar"]
categories = ["parsing", "command-line-utilities", "development-tools"]

[[bin]]
name = "iguana"
path = "src/main.rs"
test = false

[features]
debug-trace = ["iguana-compiler/debug-trace"]

[lints]
workspace = true

[dependencies]
iguana-compiler.workspace = true
clap.workspace = true
serde_json.workspace = true
include_dir = "0.7"
tiny_http = "0.12"
