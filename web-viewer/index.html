<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>iguana parse viewer</title>
    <!--
      The heavy libraries load from a CDN at runtime rather than being bundled,
      so the embedded viewer stays small. Keep these in sync with the `external`
      list in vite.config.ts. The ESM Monaco build does not inject its own styles;
      its stylesheet is loaded on demand by InputEditor.svelte, so a viewer that
      uses the plain editor (editor="plain") never fetches it.
    -->
    <script type="importmap">
      {
        "imports": {
          "monaco-editor": "https://esm.sh/monaco-editor@0.56.0",
          "cytoscape": "https://esm.sh/cytoscape@3.33.2",
          "cytoscape-tidytree": "https://esm.sh/cytoscape-tidytree@0.2.1"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
