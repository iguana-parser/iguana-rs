<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>iguana parse viewer</title>
    <!--
      The heavy libraries load from a CDN at runtime rather than being bundled,
      so the embedded viewer stays small. Keep these in sync with the `external`
      list in vite.config.ts. The ESM Monaco build does not inject its own
      styles, so its stylesheet is loaded here.
    -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/min/vs/editor/editor.main.css"
    />

    <script type="importmap">
      {
        "imports": {
          "monaco-editor": "https://esm.sh/monaco-editor@0.55.1",
          "cytoscape": "https://esm.sh/cytoscape@3.33.2",
          "cytoscape-tidytree": "https://esm.sh/cytoscape-tidytree@0.2.1"
        }
      }
    </script>
    <script type="module" crossorigin src="/assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
