[package]
name = "iguana-tests"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
iggy.workspace = true
iguana-runtime.workspace = true

[lints]
workspace = true

[workspace]
resolver = "3"
# terrarium excluded by default - it's a Tauri app with 500+ dependencies that slows rust-analyzer
# uncomment terrarium/src-tauri when working on it
members = [
    "iguana",
    "iguana-compiler",
    "iguana-runtime",
    "iggy",
    "iguana-lsp",
    "xtask",
    "tests/exact_keyword_no_layout",
    "tests/exact_keyword_multiple_ids",
    "tests/exact_keyword_generics",
    "tests/exact_keyword_contextual",
    "tests/exact_keyword_precede",
    "tests/exact_keyword",
    "tests/layout_aware_follow_required_layout",
    "tests/layout_aware_follow_no_layout",
    "tests/layout_aware_follow_same_position",
    "tests/layout_aware_follow_midrule",
    "tests/dangling_else_unsafe",
    "tests/dangling_else",
    "tests/precede_follow_restriction",
    "tests/except_follow_restriction",
    "tests/labeled_follow_restriction",
    "tests/ll1_call_error",
    "tests/amb_root_start",
    "tests/assoc_single_level",
    "tests/escaped_lit",
    "tests/alt_seq",
    "tests/amb_root_nested",
    "tests/amb_root",
    "tests/group_single_element",
    "tests/plus_alt",
    "tests/token_only_unsafe",
    "tests/ambiguous_expr_unsafe",
    "tests/ambiguous_expr",
    "tests/except_regex_reference",
    "tests/follow_restriction_lexical_multiple",
    "tests/plus_except",
    "tests/amb",
    "tests/except_nonterminal_longest_match",
    "tests/except_longest_match",
    "tests/indirect_postfix",
    "tests/indirect_prefix",
    "tests/amb_plus",
    "tests/amb_list",
    "tests/layout_nonterminal",
    "tests/longest_match",
    "tests/assoc_test",
    "tests/binary_expression_priority",
    "tests/comments",
    "tests/deep_priority",
    "tests/deep_priority_full",
    "tests/except_lexical",
    "tests/except_nonterminal",
    "tests/except_terminal",
    "tests/exclude_by_label",
    "tests/expression",
    "tests/follow_restriction",
    "tests/follow_restriction_lexical",
    "tests/follow_restriction_multiple",
    "tests/group",
    "tests/indirect_precedence",
    "tests/left_recursive_list",
    "tests/multiple_except",
    "tests/no_layout",
    "tests/opt",
    "tests/pepm16_expressions",
    "tests/plus",
    "tests/plus_group",
    "tests/plus_with_sep",
    "tests/precede_restriction",
    "tests/precede_restriction_lexical",
    "tests/prefix_above_binary",
    "tests/prefix_postfix_priority",
    "tests/regex_composition",
    "tests/simple_alt",
    "tests/star",
    "tests/star_with_sep",
    "tests/ll1_prefix_conflict",
    "tests/ll1_prefix_ambiguity",
    "tests/ll1_plus_prefix_conflict",
    "tests/ll1_alt_prefix_conflict",
    "tests/ll1_follow_restriction",
    "tests/ll1_opt_prefix_conflict",
    "tests/ll1_plus_follow_prefix",
]

# The current iguana version. Generated parsers depend on iguana-runtime at
# this version. A release updates this number and the three internal
# dependency versions below together; cargo rejects any mismatch.
[workspace.package]
version = "0.1.0-alpha"
repository = "https://github.com/iguana-parser/iguana-rs"

[workspace.dependencies]
# Shared dependencies
allocator-api2 = "0.2"
bumpalo = "3.17"
clap = { version = "4.5.51", features = ["derive"] }
hashbrown = "0.17"
log = "0.4"
proc-macro2 = { version = "1.0.103", features = ["span-locations"] }
quote = "1.0.41"
rustc-hash = "2.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
web-time = "1.1"
lsp-server = "0.10"
lsp-types = "0.97"

# Internal crates
iguana-runtime = { path = "iguana-runtime", version = "=0.1.0-alpha" }
# The crates.io name `iggy` is taken by an unrelated project; the package
# publishes as iguana-iggy and keeps `iggy` as its dependency and import name.
iggy = { path = "iggy", version = "=0.1.0-alpha", package = "iguana-iggy" }
iguana-compiler = { path = "iguana-compiler", version = "=0.1.0-alpha" }

[profile.release]
debug = true

[workspace.lints.rust]
warnings = "deny"
# No unsafe anywhere in the codebase; `forbid` so it cannot be re-enabled locally.
unsafe_code = "forbid"

[workspace.lints.clippy]
collapsible_if = "allow"
collapsible_match = "allow"
