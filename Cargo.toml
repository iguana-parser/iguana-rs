[package]
name = "iguana-tests"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
iggy.workspace = true
iguana-runtime.workspace = true

[dev-dependencies]
plus_except = { path = "tests/plus_except" }
amb = { path = "tests/amb" }
except_nonterminal_longest_match = { path = "tests/except_nonterminal_longest_match" }
except_longest_match = { path = "tests/except_longest_match" }
indirect_postfix = { path = "tests/indirect_postfix" }
indirect_prefix = { path = "tests/indirect_prefix" }
amb_plus = { path = "tests/amb_plus" }
amb_list = { path = "tests/amb_list" }
assoc_test = { path = "tests/assoc_test" }
binary_expression_priority = { path = "tests/binary_expression_priority" }
comments = { path = "tests/comments" }
deep_priority = { path = "tests/deep_priority" }
deep_priority_full = { path = "tests/deep_priority_full" }
except_lexical = { path = "tests/except_lexical" }
except_nonterminal = { path = "tests/except_nonterminal" }
except_terminal = { path = "tests/except_terminal" }
exclude_by_label = { path = "tests/exclude_by_label" }
expression = { path = "tests/expression" }
follow_restriction = { path = "tests/follow_restriction" }
follow_restriction_lexical = { path = "tests/follow_restriction_lexical" }
follow_restriction_multiple = { path = "tests/follow_restriction_multiple" }
group = { path = "tests/group" }
indirect_precedence = { path = "tests/indirect_precedence" }
layout_nonterminal = { path = "tests/layout_nonterminal" }
left_recursive_list = { path = "tests/left_recursive_list" }
longest_match = { path = "tests/longest_match" }
multiple_except = { path = "tests/multiple_except" }
no_layout = { path = "tests/no_layout" }
opt = { path = "tests/opt" }
pepm16_expressions = { path = "tests/pepm16_expressions" }
plus = { path = "tests/plus" }
plus_group = { path = "tests/plus_group" }
plus_with_sep = { path = "tests/plus_with_sep" }
precede_restriction = { path = "tests/precede_restriction" }
precede_restriction_lexical = { path = "tests/precede_restriction_lexical" }
prefix_above_binary = { path = "tests/prefix_above_binary" }
prefix_postfix_priority = { path = "tests/prefix_postfix_priority" }
regex_composition = { path = "tests/regex_composition" }
simple_alt = { path = "tests/simple_alt" }
star = { path = "tests/star" }
star_with_sep = { path = "tests/star_with_sep" }

[workspace]
resolver = "3"
# terrarium excluded by default - it's a Tauri app with 500+ dependencies that slows rust-analyzer
# uncomment terrarium/src-tauri when working on it
members = [
    "iguana",
    "iguana-runtime",
    "iggy",
    "iguana-lsp",
    "xtask",
    "tests/plus_except",
    "tests/amb",
    "tests/except_nonterminal_longest_match",
    "tests/except_longest_match",
    "tests/indirect_postfix",
    "tests/indirect_prefix",
    "tests/amb_plus",
    "tests/amb_list",
    "tests/layout_nonterminal",
    "tests/longest_match",
    "tests/assoc_test",
    "tests/binary_expression_priority",
    "tests/comments",
    "tests/deep_priority",
    "tests/deep_priority_full",
    "tests/except_lexical",
    "tests/except_nonterminal",
    "tests/except_terminal",
    "tests/exclude_by_label",
    "tests/expression",
    "tests/follow_restriction",
    "tests/follow_restriction_lexical",
    "tests/follow_restriction_multiple",
    "tests/group",
    "tests/indirect_precedence",
    "tests/left_recursive_list",
    "tests/multiple_except",
    "tests/no_layout",
    "tests/opt",
    "tests/pepm16_expressions",
    "tests/plus",
    "tests/plus_group",
    "tests/plus_with_sep",
    "tests/precede_restriction",
    "tests/precede_restriction_lexical",
    "tests/prefix_above_binary",
    "tests/prefix_postfix_priority",
    "tests/regex_composition",
    "tests/simple_alt",
    "tests/star",
    "tests/star_with_sep",
]

[workspace.dependencies]
# Shared dependencies
bumpalo = "3.17"
clap = { version = "4.5.51", features = ["derive"] }
dot = { git = "https://github.com/przygienda/dot-rust.git", rev = "fed06f613a9d72bfde711a12791f96a777b2371e" }
log = "0.4"
proc-macro2 = { version = "1.0.103", features = ["span-locations"] }
quote = "1.0.41"
rustc-hash = "2.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
web-time = "1.1"
lsp-server = "0.7"
lsp-types = "0.97"

# Internal crates
iguana-runtime = { path = "iguana-runtime" }
iggy = { path = "iggy" }
iguana = { path = "iguana" }

[profile.release]
debug = true

[workspace.lints.clippy]
collapsible_if = "allow"
collapsible_match = "allow"
