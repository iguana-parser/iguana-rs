[workspace]
# terrarium excluded by default - it's a Tauri app with 500+ dependencies that slows rust-analyzer
members = ["lsp"]
# members = ["lsp", "terrarium/src-tauri"]  # uncomment when working on terrarium

[workspace.dependencies]
iguana-runtime = { path = "../iguana-rs/iguana-runtime" }
iggy = { path = "../iguana-rs/iggy" }
iguana = { path = "../iguana-rs/iguana" }
lsp-server = "0.7"
lsp-types = "0.97"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
