[workspace]
resolver = "3"
# Terrarium and the grammar tests are separate workspaces: Terrarium's Tauri
# dependencies and the generated parser crates under tests/ would slow every
# check and rust-analyzer for the root workspace. Their checks run through
# their own manifests (docs/development.md).
members = [
    "iguana",
    "iguana-compiler",
    "iguana-runtime",
    "iggy",
    "iguana-lsp",
    "xtask",
]

# The current iguana version. Generated parsers depend on iguana-runtime at
# this version. A release updates this number and the three internal
# dependency versions below together; cargo rejects any mismatch.
[workspace.package]
version = "0.1.0-alpha.1"
repository = "https://github.com/iguana-parser/iguana-rs"
homepage = "https://iguana-parser.org"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Shared dependencies
allocator-api2 = "0.2"
bumpalo = "3.17"
clap = { version = "4.5.51", features = ["derive"] }
hashbrown = "0.17"
log = "0.4"
proc-macro2 = { version = "1.0.103", features = ["span-locations"] }
quote = "1.0.41"
rustc-hash = "2.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
web-time = "1.1"
lsp-server = "0.10"
lsp-types = "0.97"

# Internal crates
iguana-runtime = { path = "iguana-runtime", version = "=0.1.0-alpha.1" }
# The crates.io name `iggy` is taken by an unrelated project; the package
# publishes as iguana-iggy and keeps `iggy` as its dependency and import name.
iggy = { path = "iggy", version = "=0.1.0-alpha.1", package = "iguana-iggy" }
iguana-compiler = { path = "iguana-compiler", version = "=0.1.0-alpha.1" }

[profile.release]
debug = true

[workspace.lints.rust]
warnings = "deny"
# No unsafe anywhere in the codebase; `forbid` so it cannot be re-enabled locally.
unsafe_code = "forbid"

[workspace.lints.clippy]
collapsible_if = "allow"
collapsible_match = "allow"
