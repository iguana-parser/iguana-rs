[workspace]
# terrarium excluded by default - it's a Tauri app with 500+ dependencies that slows rust-analyzer
members = ["tests/assoc_test", "tests/except_lexical", "tests/except_nonterminal", "tests/except_terminal", "tests/prefix_postfix_priority", "tests/binary_expression_priority", "tests/opt", "tests/simple_alt", "tests/group", "tests/plus_group", "tests/plus_with_sep", "tests/plus", "tests/star_with_sep", "tests/star", "tests/left_recursive_list", "iguana", "iguana-runtime", "iggy", "tests/expression"]
# members = ["iguana", "iguana-runtime", "iggy", "terrarium/src-tauri"]  # uncomment when working on terrarium

[workspace.dependencies]
# Shared dependencies
clap = { version = "4.5.51", features = ["derive"] }
dot = { git = "https://github.com/przygienda/dot-rust.git", rev = "fed06f613a9d72bfde711a12791f96a777b2371e" }
log = "0.4"
proc-macro2 = { version = "1.0.103", features = ["span-locations"] }
quote = "1.0.41"
rustc-hash = "2.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }

# Internal crates
iguana-runtime = { path = "iguana-runtime" }
iggy = { path = "iggy" }
