[package]
name = "iguana-tests"
version = "0.1.0"
edition = "2024"

[dependencies]
iggy.workspace = true
iguana-runtime.workspace = true

[workspace]
resolver = "3"
# terrarium excluded by default - it's a Tauri app with 500+ dependencies that slows rust-analyzer
# uncomment terrarium/src-tauri when working on it
members = ["tests/follow_restriction_multiple", "tests/comments", "tests/indirect_precedence", "tests/multiple_except", "tests/exclude_by_label", "tests/regex_composition", "tests/precede_restriction", "tests/precede_restriction_lexical", "tests/follow_restriction_lexical", "tests/no_layout", "tests/follow_restriction", "tests/pepm16_expressions", "tests/deep_priority_full", "tests/prefix_above_binary", "tests/deep_priority", "tests/assoc_test", "tests/except_lexical", "tests/except_nonterminal", "tests/except_terminal", "tests/prefix_postfix_priority", "tests/binary_expression_priority", "tests/opt", "tests/simple_alt", "tests/group", "tests/plus_group", "tests/plus_with_sep", "tests/plus", "tests/star_with_sep", "tests/star", "tests/left_recursive_list", "iguana", "iguana-runtime", "iggy", "iguana-lsp", "tests/expression"]

[workspace.dependencies]
# Shared dependencies
bumpalo = "3.17"
clap = { version = "4.5.51", features = ["derive"] }
dot = { git = "https://github.com/przygienda/dot-rust.git", rev = "fed06f613a9d72bfde711a12791f96a777b2371e" }
log = "0.4"
proc-macro2 = { version = "1.0.103", features = ["span-locations"] }
quote = "1.0.41"
rustc-hash = "2.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
lsp-server = "0.7"
lsp-types = "0.97"

# Internal crates
iguana-runtime = { path = "iguana-runtime" }
iggy = { path = "iggy" }
iguana = { path = "iguana" }

[profile.release]
debug = true

[workspace.lints.clippy]
collapsible_if = "allow"
collapsible_match = "allow"
