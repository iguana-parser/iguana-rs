[package]
name = "ll1_prefix_ambiguity"
version = "0.1.0"
publish = false
edition = "2024"

[lib]
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "ll1_prefix_ambiguity"
path = "src/main.rs"
test = false

[dependencies]
iguana-runtime = { workspace = true, features = ["cli"] }
rustc-hash = "2.1.1"
serde_json = "1.0"

[features]
debug-trace = ["iguana-runtime/debug-trace"]
instrument = ["iguana-runtime/instrument"]
dhat-heap = ["iguana-runtime/dhat-heap"]
profile = ["iguana-runtime/profile"]
[lints]
workspace = true
