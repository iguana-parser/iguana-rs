[package]
name = "iguana-iggy"
version.workspace = true
edition = "2024"
license.workspace = true
description = "The parser for the iggy grammar definition language, generated by iguana"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["grammar", "parser", "gll", "iggy"]
categories = ["parsing"]

[lib]
name = "iggy"
path = "src/lib.rs"

[[bin]]
name = "iggy"
path = "src/main.rs"
test = false

[dependencies]
iguana-runtime.workspace = true
clap = { version = "4.5.51", features = ["derive"] }
log = "0.4"
rustc-hash = "2.1.1"
serde_json = "1.0"
dhat = { version = "0.3", optional = true }
pprof = { version = "0.15", features = ["flamegraph"], optional = true }

[features]
debug-trace = ["iguana-runtime/debug-trace"]
instrument = ["iguana-runtime/instrument"]
dhat-heap = ["dep:dhat"]
profile = ["dep:pprof"]
[lints]
workspace = true
