[package]
name = "iguana-runtime"
version.workspace = true
edition = "2024"
license.workspace = true
description = "The runtime library for parsers generated by iguana"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["parser", "gll", "runtime", "grammar"]
categories = ["parsing"]

[features]
debug-trace = []
instrument = []
# The command-line interface of a generated parser (`cli::main`).
cli = ["dep:clap"]
# Heap profiling with dhat and the sampling profiler behind `--profile`, both
# part of the command-line interface.
dhat-heap = ["cli", "dep:dhat"]
profile = ["cli", "dep:pprof"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
allocator-api2.workspace = true
bumpalo = { workspace = true, features = ["allocator-api2"] }
hashbrown.workspace = true
log.workspace = true
proc-macro2.workspace = true
quote.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
web-time.workspace = true
env_logger = "0.11.8"
clap = { workspace = true, optional = true }
dhat = { version = "0.3", optional = true }
pprof = { version = "0.15", features = ["flamegraph"], optional = true }
